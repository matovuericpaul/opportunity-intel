[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step required — static frontend + Node functions.'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[dev]
  functions = "netlify/functions"
  publish = "public"
